name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          test -f index.html
          echo "HTML file found"

      - name: Check CSS file
        run: |
          test -f style.css
          echo "CSS file found"

      - name: Check JavaScript file
        run: |
          test -f script.js
          echo "JavaScript file found"

      - name: Build
        run: |
          echo "Building e-commerce website..."
          echo "Build completed successfully"

      - name: Generate logs
        run: |
          echo "CI pipeline completed successfully"
          